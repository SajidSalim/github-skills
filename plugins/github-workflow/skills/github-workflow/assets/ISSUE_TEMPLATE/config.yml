# Replace OWNER/REPO before installing.
# Drop the "Question or discussion" link unless Discussions is actually enabled — check with
#   gh repo view --json hasDiscussionsEnabled
# A contact link to /discussions on a repo without Discussions renders as a 404.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/OWNER/REPO/security/advisories/new
    about: >
      Do not open a public issue for an exploitable vulnerability. Report it privately here.
  - name: Question or discussion
    url: https://github.com/OWNER/REPO/discussions
    about: Not sure it is a bug or a feature? Start here.
