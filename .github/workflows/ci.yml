name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null; then
            if [ "$RUNNER_OS" = "Windows" ]; then choco install jq -y --no-progress; else sudo apt-get install -y jq; fi
          fi
          jq --version
      - name: Bash suite
        run: bash tests/github-workflow/run-tests.sh
      - name: Node suite
        run: node --test tests/github-workflow/hooks/*.test.mjs

  bash32:
    name: scripts under macOS /bin/bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put /bin/bash first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Script suites
        run: |
          bash --version | head -1
          for s in lint-issue-labels find-duplicates bootstrap-labels run-hook portability; do
            bash tests/github-workflow/run-tests.sh --filter "$s"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: hooks.json launch through macOS /bin/sh
        run: node --test tests/github-workflow/hooks/launch.test.mjs

  nobash:
    name: hooks.json launch with no bash (Alpine, busybox sh)
    runs-on: ubuntu-latest
    container: node:20-alpine
    defaults:
      run:
        shell: sh
    steps:
      - name: Install git
        run: apk add --no-cache git
      - uses: actions/checkout@v4
      - name: Confirm there is no bash
        run: |
          ls -l /bin/sh
          if command -v bash; then echo "bash is installed; this job must run without it" >&2; exit 1; fi
      - name: hooks.json launch under busybox sh
        run: node --test tests/github-workflow/hooks/launch.test.mjs

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the shipped scripts
        run: shellcheck -S warning plugins/github-workflow/skills/github-workflow/scripts/*.sh plugins/github-workflow/hooks/run-hook.sh
      - name: the hook launcher is POSIX sh, no bashisms
        run: shellcheck -s sh -S style plugins/github-workflow/hooks/run-hook.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate plugins/github-workflow --strict
      - run: claude plugin validate . --strict
